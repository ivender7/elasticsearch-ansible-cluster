---
# SSH Hardening
- name: Harden sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    validate: /usr/sbin/sshd -t -f %s
  loop:
    - regexp: '^#?PermitRootLogin'
      line: "PermitRootLogin {{ common_ssh_permit_root_login }}"
    - regexp: '^#?PasswordAuthentication'
      line: "PasswordAuthentication {{ common_ssh_password_authentication }}"
    - regexp: '^#?X11Forwarding'
      line: "X11Forwarding no"
    - regexp: '^#?MaxAuthTries'
      line: "MaxAuthTries 3"
  notify: Restart sshd

- name: Restrict SSH to specific users
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?AllowUsers'
    line: "AllowUsers {{ common_ssh_allow_users | join(' ') }}"
    validate: /usr/sbin/sshd -t -f %s
  when: common_ssh_allow_users | length > 0
  notify: Restart sshd
